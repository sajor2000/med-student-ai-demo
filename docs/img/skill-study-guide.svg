<?xml version="1.0" encoding="UTF-8"?>
<svg id="skill-study-guide" viewBox="0 0 1200 427" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="skill-study-guide-title skill-study-guide-desc">
  <title id="skill-study-guide-title">How study-guide works</title>
  <desc id="skill-study-guide-desc">/study-guide sample "MRSA resistance and treatment". Goes in: notes/&lt;case&gt;/ (all of it, or just your focus topic); StatPearls and PubMed reviews, searched through the PubMed connector. The AI: Drafts the guide: objectives, one-page summary, topic sections, comparison tables, self-test; every bullet cited; Adds "Beyond the slides" for the 3 highest-yield topics, with PubMed IDs from a real lookup; check.py verifies every citation; the AI fixes the file until it prints PASS. You get: output/&lt;case&gt;/study-guide.md; In chat: sections written, citation counts, disagreements between sources, and one citation to open. Next: Try to recall first, then read it as the answer key; Open the citation it points out.</desc>
  <defs>
    <style>#skill-study-guide { font-family: system-ui, sans-serif; }
      #skill-study-guide text { font-family: system-ui, sans-serif; fill: #0f1115; }
      #skill-study-guide .name { font-size: 18px; font-weight: 700; }
      #skill-study-guide .t { font-size: 14px; }
      #skill-study-guide .sub { font-size: 14px; fill: #2f3a4f; }
      #skill-study-guide .lbl { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; fill: #44506a; }
      #skill-study-guide .cmd { font-size: 20px; font-weight: 700; fill: #0b4f9c; font-family: ui-monospace, Menlo, Consolas, monospace; }
      #skill-study-guide .file { font-size: 13px; font-family: ui-monospace, Menlo, Consolas, monospace; fill: #0f1115; }
      #skill-study-guide .num { font-size: 13px; font-weight: 700; fill: #ffffff; }
      #skill-study-guide .box { fill: #ffffff; stroke: #0f1115; stroke-width: 2; }
      #skill-study-guide .typed { fill: #ffffff; stroke: #0b4f9c; stroke-width: 2.5; stroke-dasharray: 7,4; }
      #skill-study-guide .local { fill: #eef6f0; stroke: #2e6b44; stroke-width: 2; }
      #skill-study-guide .cloud { fill: #fff3e6; stroke: #a33d00; stroke-width: 2; stroke-dasharray: 7,4; }
      #skill-study-guide .panel { fill: #f4f6f9; stroke: #b9c3d3; stroke-width: 1.5; }
      #skill-study-guide .gate { fill: #a33d00; fill-opacity: 0.10; stroke: #a33d00; stroke-width: 3; }
      #skill-study-guide .localt { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; fill: #2e6b44; }
      #skill-study-guide .cloudt { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; fill: #a33d00; }</style>
    <marker id="skill-study-guide-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f3a4f"/></marker>
    <marker id="skill-study-guide-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a33d00"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="427" fill="#ffffff"/>
<rect x="20" y="16" width="1160" height="72" rx="10" class="typed"/>
  <text x="38" y="38" class="lbl">YOU TYPE IN CLAUDE CODE</text>
  <text x="38" y="70" class="cmd">/study-guide sample "MRSA resistance and treatment"</text>
  <text x="1162" y="70" class="name" text-anchor="end">A cited reference to check yourself against</text>
  <rect x="20" y="112" width="270" height="295" rx="10" class="panel"/>
  <text x="36" y="138" class="lbl">WHAT GOES IN</text>
  <path d="M293,259 H313" fill="none" stroke="#2f3a4f" stroke-width="2" marker-end="url(#skill-study-guide-arrow)"/>
  <rect x="316" y="112" width="270" height="295" rx="10" class="panel"/>
  <text x="332" y="138" class="lbl">WHAT THE AI DOES</text>
  <path d="M589,259 H609" fill="none" stroke="#2f3a4f" stroke-width="2" marker-end="url(#skill-study-guide-arrow)"/>
  <rect x="612" y="112" width="270" height="295" rx="10" class="local"/>
  <text x="628" y="138" class="lbl">WHAT YOU GET</text>
  <path d="M885,259 H905" fill="none" stroke="#2f3a4f" stroke-width="2" marker-end="url(#skill-study-guide-arrow)"/>
  <rect x="908" y="112" width="270" height="295" rx="10" class="panel"/>
  <text x="924" y="138" class="lbl">WHAT YOU DO NEXT</text>
  <circle cx="39" cy="159" r="2.6" fill="#2f3a4f"/>
  <text x="50" y="164" class="t">notes/&lt;case&gt;/ (all of it, or</text>
    <text x="50" y="183" class="t">just your focus topic)</text>
  <circle cx="39" cy="205" r="2.6" fill="#2f3a4f"/>
  <text x="50" y="210" class="t">StatPearls and PubMed reviews,</text>
    <text x="50" y="229" class="t">searched through the PubMed</text>
    <text x="50" y="248" class="t">connector</text>
  <circle cx="341" cy="159" r="10" fill="#0b4f9c"/>
  <text x="341" y="164" class="num" text-anchor="middle">1</text>
  <text x="360" y="164" class="t">Drafts the guide: objectives,</text>
    <text x="360" y="183" class="t">one-page summary, topic</text>
    <text x="360" y="202" class="t">sections, comparison tables,</text>
    <text x="360" y="221" class="t">self-test; every bullet cited</text>
  <circle cx="341" cy="247" r="10" fill="#0b4f9c"/>
  <text x="341" y="252" class="num" text-anchor="middle">2</text>
  <text x="360" y="252" class="t">Adds "Beyond the slides" for</text>
    <text x="360" y="271" class="t">the 3 highest-yield topics,</text>
    <text x="360" y="290" class="t">with PubMed IDs from a real</text>
    <text x="360" y="309" class="t">lookup</text>
  <circle cx="341" cy="335" r="10" fill="#0b4f9c"/>
  <text x="341" y="340" class="num" text-anchor="middle">3</text>
  <text x="360" y="340" class="t">check.py verifies every</text>
    <text x="360" y="359" class="t">citation; the AI fixes the</text>
    <text x="360" y="378" class="t">file until it prints PASS</text>
  <circle cx="631" cy="159" r="2.6" fill="#2f3a4f"/>
  <text x="642" y="164" class="t">output/&lt;case&gt;/study-guide.md</text>
  <circle cx="631" cy="186" r="2.6" fill="#2f3a4f"/>
  <text x="642" y="191" class="t">In chat: sections written,</text>
    <text x="642" y="210" class="t">citation counts, disagreements</text>
    <text x="642" y="229" class="t">between sources, and one</text>
    <text x="642" y="248" class="t">citation to open</text>
  <circle cx="927" cy="159" r="2.6" fill="#2f3a4f"/>
  <text x="938" y="164" class="t">Try to recall first, then read</text>
    <text x="938" y="183" class="t">it as the answer key</text>
  <circle cx="927" cy="205" r="2.6" fill="#2f3a4f"/>
  <text x="938" y="210" class="t">Open the citation it points out</text>
</svg>
