<?xml version="1.0" encoding="UTF-8"?>
<svg id="skill-anki-sync" viewBox="0 0 1200 427" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="skill-anki-sync-title skill-anki-sync-desc">
  <title id="skill-anki-sync-title">How anki-sync works</title>
  <desc id="skill-anki-sync-desc">/anki-sync sample. Goes in: output/&lt;case&gt;/flashcards.csv and/or diagrams/*.occlusion.json; Anki desktop open, with the AnkiConnect add-on (code 2055492159). The AI: anki_sync.py talks to Anki on your own computer (127.0.0.1) and touches only notes tagged msad in the deck AI Study::&lt;case&gt;; Cards made from misses go to the AI Study::&lt;case&gt;::misses subdeck; Cards you forgot 3 or more times are added to weak-spots.md. You get: Cards in Anki; One summary line: added, updated, adopted, skipped, weak spots; New lines in weak-spots.md. Next: Review in Anki; Run /flashcards &lt;case&gt; again: it targets those weak spots.</desc>
  <defs>
    <style>#skill-anki-sync { font-family: system-ui, sans-serif; }
      #skill-anki-sync text { font-family: system-ui, sans-serif; fill: #0f1115; }
      #skill-anki-sync .name { font-size: 18px; font-weight: 700; }
      #skill-anki-sync .t { font-size: 14px; }
      #skill-anki-sync .sub { font-size: 14px; fill: #2f3a4f; }
      #skill-anki-sync .lbl { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; fill: #44506a; }
      #skill-anki-sync .cmd { font-size: 20px; font-weight: 700; fill: #0b4f9c; font-family: ui-monospace, Menlo, Consolas, monospace; }
      #skill-anki-sync .file { font-size: 13px; font-family: ui-monospace, Menlo, Consolas, monospace; fill: #0f1115; }
      #skill-anki-sync .num { font-size: 13px; font-weight: 700; fill: #ffffff; }
      #skill-anki-sync .box { fill: #ffffff; stroke: #0f1115; stroke-width: 2; }
      #skill-anki-sync .typed { fill: #ffffff; stroke: #0b4f9c; stroke-width: 2.5; stroke-dasharray: 7,4; }
      #skill-anki-sync .local { fill: #eef6f0; stroke: #2e6b44; stroke-width: 2; }
      #skill-anki-sync .cloud { fill: #fff3e6; stroke: #a33d00; stroke-width: 2; stroke-dasharray: 7,4; }
      #skill-anki-sync .panel { fill: #f4f6f9; stroke: #b9c3d3; stroke-width: 1.5; }
      #skill-anki-sync .gate { fill: #a33d00; fill-opacity: 0.10; stroke: #a33d00; stroke-width: 3; }
      #skill-anki-sync .localt { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; fill: #2e6b44; }
      #skill-anki-sync .cloudt { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; fill: #a33d00; }</style>
    <marker id="skill-anki-sync-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f3a4f"/></marker>
    <marker id="skill-anki-sync-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a33d00"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="427" fill="#ffffff"/>
<rect x="20" y="16" width="1160" height="72" rx="10" class="typed"/>
  <text x="38" y="38" class="lbl">YOU TYPE IN CLAUDE CODE</text>
  <text x="38" y="70" class="cmd">/anki-sync sample</text>
  <text x="1162" y="70" class="name" text-anchor="end">Push cards into Anki, pull your misses back</text>
  <rect x="20" y="112" width="270" height="295" rx="10" class="panel"/>
  <text x="36" y="138" class="lbl">WHAT GOES IN</text>
  <path d="M293,259 H313" fill="none" stroke="#2f3a4f" stroke-width="2" marker-end="url(#skill-anki-sync-arrow)"/>
  <rect x="316" y="112" width="270" height="295" rx="10" class="panel"/>
  <text x="332" y="138" class="lbl">WHAT THE AI DOES</text>
  <path d="M589,259 H609" fill="none" stroke="#2f3a4f" stroke-width="2" marker-end="url(#skill-anki-sync-arrow)"/>
  <rect x="612" y="112" width="270" height="295" rx="10" class="local"/>
  <text x="628" y="138" class="lbl">WHAT YOU GET</text>
  <path d="M885,259 H905" fill="none" stroke="#2f3a4f" stroke-width="2" marker-end="url(#skill-anki-sync-arrow)"/>
  <rect x="908" y="112" width="270" height="295" rx="10" class="panel"/>
  <text x="924" y="138" class="lbl">WHAT YOU DO NEXT</text>
  <circle cx="39" cy="159" r="2.6" fill="#2f3a4f"/>
  <text x="50" y="164" class="t">output/&lt;case&gt;/flashcards.csv</text>
    <text x="50" y="183" class="t">and/or</text>
    <text x="50" y="202" class="t">diagrams/*.occlusion.json</text>
  <circle cx="39" cy="224" r="2.6" fill="#2f3a4f"/>
  <text x="50" y="229" class="t">Anki desktop open, with the</text>
    <text x="50" y="248" class="t">AnkiConnect add-on (code</text>
    <text x="50" y="267" class="t">2055492159)</text>
  <circle cx="341" cy="159" r="10" fill="#0b4f9c"/>
  <text x="341" y="164" class="num" text-anchor="middle">1</text>
  <text x="360" y="164" class="t">anki_sync.py talks to Anki on</text>
    <text x="360" y="183" class="t">your own computer (127.0.0.1)</text>
    <text x="360" y="202" class="t">and touches only notes tagged</text>
    <text x="360" y="221" class="t">msad in the deck AI</text>
    <text x="360" y="240" class="t">Study::&lt;case&gt;</text>
  <circle cx="341" cy="266" r="10" fill="#0b4f9c"/>
  <text x="341" y="271" class="num" text-anchor="middle">2</text>
  <text x="360" y="271" class="t">Cards made from misses go to</text>
    <text x="360" y="290" class="t">the AI Study::&lt;case&gt;::misses</text>
    <text x="360" y="309" class="t">subdeck</text>
  <circle cx="341" cy="335" r="10" fill="#0b4f9c"/>
  <text x="341" y="340" class="num" text-anchor="middle">3</text>
  <text x="360" y="340" class="t">Cards you forgot 3 or more</text>
    <text x="360" y="359" class="t">times are added to</text>
    <text x="360" y="378" class="t">weak-spots.md</text>
  <circle cx="631" cy="159" r="2.6" fill="#2f3a4f"/>
  <text x="642" y="164" class="t">Cards in Anki</text>
  <circle cx="631" cy="186" r="2.6" fill="#2f3a4f"/>
  <text x="642" y="191" class="t">One summary line: added,</text>
    <text x="642" y="210" class="t">updated, adopted, skipped, weak</text>
    <text x="642" y="229" class="t">spots</text>
  <circle cx="631" cy="251" r="2.6" fill="#2f3a4f"/>
  <text x="642" y="256" class="t">New lines in weak-spots.md</text>
  <circle cx="927" cy="159" r="2.6" fill="#2f3a4f"/>
  <text x="938" y="164" class="t">Review in Anki</text>
  <circle cx="927" cy="186" r="2.6" fill="#2f3a4f"/>
  <text x="938" y="191" class="t">Run /flashcards &lt;case&gt; again:</text>
    <text x="938" y="210" class="t">it targets those weak spots</text>
</svg>
